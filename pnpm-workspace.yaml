packages:
  - backend
  - frontend
  - shared

# Scripts de build de dependência rodam só quando listados aqui: o pnpm não
# executa nenhum por padrão e interrompe o install enquanto a decisão não for
# tomada explicitamente.
allowBuilds:
  # Compila binding nativo; sem o build o @adonisjs/assembler cai no fallback e
  # o HMR fica visivelmente mais lento.
  '@swc/core': true
  # Não é usado: a conexão é PostgreSQL. Compilar o binding do SQLite seria
  # minutos de build a cada install para um driver que ninguém abre.
  better-sqlite3: false
  # Resolver nativo do `eslint-plugin-import-x`. O postinstall só confere o
  # binário pré-compilado da plataforma; sem decisão, o install para.
  unrs-resolver: true
  # Bundler do Vite e do Nitro: o postinstall baixa o binário da plataforma.
  esbuild: true
  # Compilador de CSS do Tailwind 4, mesmo motivo.
  lightningcss: true

# Publicadas há menos tempo que a idade mínima do pnpm e exigidas pela régua
# (_standards/i18n.md §4: `inlang check` pede @inlang/cli 3.4+). Sai quando a
# versão passar da idade mínima.
minimumReleaseAgeExclude:
  - '@inlang/cli@3.4.5'
  - '@inlang/sdk@4.1.0'
