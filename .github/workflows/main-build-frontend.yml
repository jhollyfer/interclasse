name: Build Frontend

# The steps are the check's (`main-check-frontend.yml`), plus the revision stamp and the
# `.output` artifact that the image packages (`_standards/tooling.md` §8.1, §8.3). Calling the
# same reusable keeps a single gate for the PR and the deploy.
on:
  workflow_call:
    secrets:
      VITE_API_URL:
        required: false
      VITE_SITE_URL:
        required: false
    inputs:
      e2e:
        description: roda o Playwright; a main passa false, o PR já provou o mesmo código
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/main-check-frontend.yml
    with:
      publish: true
      e2e: ${{ inputs.e2e }}
    secrets:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
