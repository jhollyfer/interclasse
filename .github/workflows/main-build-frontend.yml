name: Build Frontend

# Reutilizável: quem chama é o `main.yml`, no push para `main`. Repete os portões
# do PR (`main-check-frontend.yml`) e publica o `.output` como artifact, que é o
# que a imagem empacota (_standards/tooling.md §7, §8.1).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/main-check-frontend.yml

  build:
    name: Compile & Package
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm e Node
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter ./shared --fail-if-no-match run build

      - name: Compile messages
        run: pnpm --filter ./frontend --fail-if-no-match i18n:compile

      # O carimbo da revisão: vira `/revision.txt` e é o que o smoke test do
      # deploy confere. Antes do build e em `public/`: o Nitro serve `public/` por
      # um manifesto congelado no build, e arquivo escrito depois cai no
      # catch-all de SSR (200 com HTML).
      - name: Carimba a revisão antes do build
        env:
          REVISION: ${{ github.sha }}
        run: echo "$REVISION" > frontend/public/revision.txt

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm --filter ./frontend --fail-if-no-match run build

      - name: O carimbo entrou no manifesto do Nitro
        working-directory: ./frontend
        run: |
          if ! grep -q '"/revision.txt"' .output/server/index.mjs; then
            echo 'revision.txt não está no manifesto de assets do Nitro.'
            echo 'O carimbo precisa ser escrito ANTES do build, em public/.'
            exit 1
          fi

      # Sobe antes da conferência: quando o guarda reprova, o `.output/` é o que
      # se precisa abrir para achar a leitura culpada.
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-build
          retention-days: 1
          include-hidden-files: true
          path: frontend/.output/

      # Falha o job, mas nenhuma imagem sai dele: `docker-frontend` depende deste
      # job, e não do artifact.
      - name: Ciclos de chunk
        run: pnpm --filter ./frontend --fail-if-no-match check-cycles
