name: Check Backend

on:
  workflow_call:

jobs:
  check:
    name: Backend - Lint, Typecheck, OpenAPI & Test
    runs-on: ubuntu-latest

    # A porta e o nome do banco vêm de `backend/.env.test`, que é versionado:
    # 5434 no host e `interclasse_test`. Declarar `POSTGRES_DB` já com o
    # nome de teste dispensa o `createdb` que o desenvolvimento local faz à mão.
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: interclasse
          POSTGRES_PASSWORD: interclasse
          POSTGRES_DB: interclasse_test
        ports:
          - "5434:5432"
        options: >-
          --health-cmd "pg_isready -U interclasse -d interclasse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./backend
        run: pnpm install --frozen-lockfile

      - name: Run linter
        working-directory: ./backend
        run: pnpm lint

      - name: Typecheck
        working-directory: ./backend
        run: pnpm typecheck

      # `openapi.json` é artefato commitado. Este passo reprova quem mexeu numa
      # rota, num validator ou num bloco `docs` e não regerou o documento.
      #
      # O bloco `env` é do passo, e não do job: `openapi:generate` roda com
      # `startApp`, ou seja, boota a aplicação, e o boot valida `start/env.ts`.
      # Estes valores existem só para o schema passar — o comando lê rotas e
      # schemas VineJS, não toca no banco nem no bucket. No job inteiro eles
      # venceriam o `.env.test` do passo seguinte, porque variável de processo
      # tem precedência sobre arquivo, e a suíte apontaria para um banco que
      # não existe.
      - name: Check OpenAPI document
        working-directory: ./backend
        env:
          NODE_ENV: development
          PORT: "3333"
          HOST: 0.0.0.0
          LOG_LEVEL: info
          APP_KEY: ci-placeholder-sem-uso-fora-deste-job
          APP_SERVER_URL: http://localhost:3333
          SESSION_DRIVER: cookie
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          UPLOAD_MAX_SIZE: "1073741824"
          # Obrigatórias no schema; o gerador não fala com o bucket.
          STORAGE_KEY: ci-placeholder
          STORAGE_SECRET: ci-placeholder
          STORAGE_BUCKET: ci-placeholder
          STORAGE_ENDPOINT: http://localhost:9004
        run: node ace openapi:generate --check --strict

      # Os guardas de forma do padrão. O `sync:check` (cópia da régua contra o
      # upstream) fica de fora: é conferência local, não portão de deploy.
      - name: Guard-rails do padrão
        working-directory: ./backend
        run: pnpm pattern:check && pnpm authz:check

      # O MinIO não sobe como `services:` porque precisa de `command` — a chave
      # existe no compose e não no bloco de serviço do Actions. `--network host`
      # com `--address :9004` reproduz a porta publicada do compose, que
      # é a que `.env.test` procura.
      #
      # O bootstrap é o mesmo do serviço `storage-bootstrap`: cria o bucket de
      # teste e libera leitura anônima, porque a `url` de um anexo é pública.
      - name: Start MinIO
        run: |
          docker run -d --name storage --network host \
            -e MINIO_ROOT_USER=interclasse \
            -e MINIO_ROOT_PASSWORD=interclasse-secret \
            -e MINIO_API_CORS_ALLOW_ORIGIN='*' \
            pgsty/minio:latest server /data --address ":9004" --console-address ":9003"

          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9004/minio/health/live && break
            sleep 2
          done

          docker run --rm --network host --entrypoint sh pgsty/mc:latest -c '
            set -e
            mc alias set target http://localhost:9004 interclasse interclasse-secret
            mc mb --ignore-existing target/interclasse-test
            mc anonymous set none target/interclasse-test
          '

      # A suíte é funcional e fala com o Postgres e com o MinIO de verdade
      # (`multipart.spec.ts`, `storages.spec.ts`) — é o mesmo caminho de código
      # que produção usa. Só entram aqui as variáveis que `.env.test` não traz:
      # o resto sai do arquivo versionado, e sobrescrevê-lo daqui apontaria a
      # suíte para outro banco e outro bucket.
      - name: Test
        working-directory: ./backend
        env:
          PORT: "3333"
          HOST: 0.0.0.0
          LOG_LEVEL: info
          APP_KEY: ci-placeholder-sem-uso-fora-deste-job
          APP_SERVER_URL: http://localhost:3333
        run: pnpm test

      # Depois da suíte, no mesmo job: `di:check` boota a aplicação, e aqui o
      # banco e o bucket já estão de pé. Constrói todo service e policy pelo
      # container - a dependência que ele não sabe resolver aparece no boot, e
      # não na primeira requisição que a usa.
      #
      # `NODE_ENV: test` é o que faz o Adonis carregar o `.env.test` (banco,
      # bucket, sessão). O `pnpm test` o define sozinho; este passo não, e sem
      # ele o boot reprovava por `DATABASE_URL` ausente.
      - name: Injeção de dependência
        working-directory: ./backend
        env:
          NODE_ENV: test
          PORT: "3333"
          HOST: 0.0.0.0
          LOG_LEVEL: info
          APP_KEY: ci-placeholder-sem-uso-fora-deste-job
          APP_SERVER_URL: http://localhost:3333
        run: pnpm di:check
