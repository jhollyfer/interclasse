name: Check Backend

# Reutilizável: o PR (`ci.yml`) e o push em `main` (`main.yml`) chamam este
# mesmo arquivo, para o PR não passar por uma régua diferente da do deploy
# (_standards/tooling.md §7, §8.1). O `shared/` roda antes do backend.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Shared e Backend - check, testes e build
    runs-on: ubuntu-latest

    # A porta e o nome do banco vêm de `backend/.env.test`, que é versionado:
    # 5434 no host e `interclasse_test`.
    services:
      database:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: interclasse
          POSTGRES_PASSWORD: interclasse
          POSTGRES_DB: interclasse_test
        ports:
          - '5434:5432'
        options: >-
          --health-cmd "pg_isready -U interclasse -d interclasse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # O histórico inteiro: o passo de autor lê `origin/<base>..HEAD`.
          fetch-depth: 0
          persist-credentials: false

      # Autor único e sem marca de agente (tooling.md §6, camada 3). Pega o
      # commit feito com `--no-verify` ou numa máquina sem o hook. Lê até o
      # head do PR, não até o HEAD: no `pull_request` o HEAD é o merge sintético
      # que o GitHub assina com o e-mail noreply do autor do PR.
      - name: Autor e trailer dos commits
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          commits=$(git log --format='%an <%ae>%n%B' "origin/${BASE_REF}..${HEAD_SHA}")
          if printf '%s\n' "$commits" | grep -qiE '^(co-authored-by|claude-session):|generated with|noreply@anthropic\.com|anthropic\.com/claude'; then
            echo "trailer ou marca de agente em commit do PR" >&2
            exit 1
          fi
          if git log --format='%ae' "origin/${BASE_REF}..${HEAD_SHA}" | grep -qvx 'jhollyfer.fr@gmail.com'; then
            echo "autor de commit diferente do dono do repositório" >&2
            exit 1
          fi

      - name: Setup pnpm e Node
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # O backend importa o `dist/` do `@interclasse/shared`.
      - name: Build shared
        run: pnpm --filter ./shared --fail-if-no-match run build

      - name: Check shared
        run: pnpm --filter ./shared --fail-if-no-match check && pnpm --filter ./shared --fail-if-no-match test:unit

      - name: Lint
        run: pnpm --filter ./backend --fail-if-no-match lint

      - name: Typecheck
        run: pnpm --filter ./backend --fail-if-no-match typecheck

      - name: Guard-rails do padrão
        run: pnpm --filter ./backend --fail-if-no-match pattern:check && pnpm --filter ./backend --fail-if-no-match authz:check

      # Direção das camadas e ciclo (domain.md §8).
      - name: Camadas
        run: pnpm --filter ./backend --fail-if-no-match depcruise

      # `openapi.json` é artefato commitado. O `env` é do passo, e não do job:
      # o comando boota a aplicação e o boot valida `start/env.ts`. Estes valores
      # existem só para o schema passar; no job inteiro venceriam o `.env.test`
      # dos passos seguintes, porque variável de processo tem precedência sobre
      # arquivo.
      - name: Check OpenAPI document
        working-directory: ./backend
        env:
          NODE_ENV: development
          PORT: '3333'
          HOST: 0.0.0.0
          LOG_LEVEL: info
          APP_KEY: ci-placeholder-sem-uso-fora-deste-job
          APP_SERVER_URL: http://localhost:3333
          SESSION_DRIVER: cookie
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          UPLOAD_MAX_SIZE: '1073741824'
          STORAGE_KEY: ci-placeholder
          STORAGE_SECRET: ci-placeholder
          STORAGE_BUCKET: ci-placeholder
          STORAGE_ENDPOINT: http://localhost:9004
        run: pnpm openapi:check

      - name: Test unit
        working-directory: ./backend
        env:
          PORT: '3333'
          HOST: 0.0.0.0
          LOG_LEVEL: info
          APP_KEY: ci-placeholder-sem-uso-fora-deste-job
          APP_SERVER_URL: http://localhost:3333
        run: pnpm test:unit

      # O MinIO não sobe como `services:` porque precisa de `command`. A imagem
      # é compilada de `backend/infra/minio/Dockerfile` (a `minio/minio` saiu do
      # Docker Hub), com cache da camada de build (tooling.md §8.4).
      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build MinIO
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend/infra/minio
          load: true
          push: false
          tags: interclasse-minio-test:2025-10-15
          cache-from: type=gha,scope=minio
          cache-to: type=gha,mode=max,scope=minio

      - name: Start MinIO
        env:
          MINIO_ROOT_USER: ci-minio-root
          MINIO_ROOT_PASSWORD: ci-minio-root-secret
        run: |
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD \
            -e MINIO_API_CORS_ALLOW_ORIGIN='http://localhost:5173,http://localhost:4173' \
            interclasse-minio-test:2025-10-15 server /data --address ":9004" --console-address ":9003"

      # A espera é pelo estado: o setup roda até o bucket de teste existir e
      # responder, e não por `sleep` (tooling.md §7, passo 7).
      - name: Setup MinIO e espera pelo bucket
        env:
          MINIO_ENDPOINT: http://localhost:9004
          MINIO_ROOT_USER: ci-minio-root
          MINIO_ROOT_PASSWORD: ci-minio-root-secret
          STORAGE_KEY: interclasse
          STORAGE_SECRET: interclasse-secret
          STORAGE_BUCKET: interclasse
        run: |
          for _ in $(seq 1 30); do
            if docker run --rm --network host \
              -e MINIO_ENDPOINT -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD \
              -e STORAGE_KEY -e STORAGE_SECRET -e STORAGE_BUCKET \
              -v "$PWD/backend/infra/minio:/setup:ro" \
              --entrypoint /bin/sh interclasse-minio-test:2025-10-15 \
              -c 'sh /setup/minio-setup.sh && mc ls "local/${STORAGE_BUCKET}-test"'; then
              exit 0
            fi
            sleep 2
          done
          echo "o bucket de teste não ficou disponível" >&2
          exit 1

      # A suíte fala com o Postgres e com o MinIO de verdade. Só entram aqui as
      # variáveis que `.env.test` não traz.
      - name: Test e2e
        working-directory: ./backend
        env:
          PORT: '3333'
          HOST: 0.0.0.0
          LOG_LEVEL: info
          APP_KEY: ci-placeholder-sem-uso-fora-deste-job
          APP_SERVER_URL: http://localhost:3333
        run: pnpm test:e2e

      # Depois da suíte, no mesmo job: `di:check` boota a aplicação, e aqui o
      # banco e o bucket já estão de pé. `NODE_ENV: test` faz o Adonis carregar
      # o `.env.test`.
      - name: Injeção de dependência
        working-directory: ./backend
        env:
          NODE_ENV: test
          PORT: '3333'
          HOST: 0.0.0.0
          LOG_LEVEL: info
          APP_KEY: ci-placeholder-sem-uso-fora-deste-job
          APP_SERVER_URL: http://localhost:3333
        run: pnpm di:check

      # Typecheck de dev e build de produção usam configs diferentes o bastante
      # para um passar e o outro falhar (`node ace build`).
      - name: Build
        working-directory: ./backend
        env:
          NODE_ENV: development
          PORT: '3333'
          HOST: 0.0.0.0
          LOG_LEVEL: info
          APP_KEY: ci-placeholder-sem-uso-fora-deste-job
          APP_SERVER_URL: http://localhost:3333
          SESSION_DRIVER: cookie
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          UPLOAD_MAX_SIZE: '1073741824'
          STORAGE_KEY: ci-placeholder
          STORAGE_SECRET: ci-placeholder
          STORAGE_BUCKET: ci-placeholder
          STORAGE_ENDPOINT: http://localhost:9004
        run: pnpm run build
