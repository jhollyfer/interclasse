name: Build, Docker and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `check-backend` ∥ `build-frontend` → `docker-backend` ∥ `docker-frontend` → `deploy`
# (`_standards/tooling.md` §8.1).
jobs:
  check-backend:
    uses: ./.github/workflows/main-check-backend.yml

  # Playwright runs only on the PR: the merge enters with the E2E already proved, and
  # repeating it delays the deploy (`_standards/tooling.md` §8.1, `DECISIONS.md` #273).
  build-frontend:
    uses: ./.github/workflows/main-build-frontend.yml
    with:
      e2e: false
    secrets:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}

  docker-backend:
    needs: check-backend
    uses: ./.github/workflows/main-docker-backend.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  docker-frontend:
    needs: build-frontend
    uses: ./.github/workflows/main-docker-frontend.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # After the two images are on Docker Hub, and not before: deploying the frontend
  # against an API whose build failed is publishing half a version.
  deploy-to-coolify:
    needs: [docker-backend, docker-frontend]
    uses: ./.github/workflows/main-deploy-coolify.yml
    secrets:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
      COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
