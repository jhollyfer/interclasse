name: Commitlint

# Os commits deste repositorio sao Conventional Commits em pt-BR, e isso estava
# escrito na regua e cobrado por ninguem. O `pre-commit` nao os valida, e quem
# usa `--no-verify` passa direto.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # O historico inteiro: sem ele o `--from` do PR nao resolve.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Validar commits do PR
        # O mesmo comando do hook `commit-msg`, lendo o `.commitlintrc.json` do repo.
        run: npx --yes -p @commitlint/cli@21 -p @commitlint/config-conventional@21 commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
