name: Commitlint

# Os commits deste repositorio sao Conventional Commits em pt-BR, e isso estava
# escrito na regua e cobrado por ninguem. O `pre-commit` nao os valida, e quem
# usa `--no-verify` passa direto.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # O historico inteiro: sem ele o `--from` do PR nao resolve.
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Validar commits do PR
        run: npx --yes commitlint@20 --extends @commitlint/config-conventional --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
