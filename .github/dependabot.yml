# Dependências na última versão publicada (_standards/tooling.md §0): o Dependabot
# abre o PR de atualização, e o upgrade é revisado antes do merge - changelog e
# `.d.ts` novos em major. Um workspace pnpm com lockfile único na raiz
# (`tooling.md` §1): os três pacotes saem de `directories`.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /backend
      - /frontend
      - /shared
    schedule:
      interval: weekly
    groups:
      minor-e-patch:
        update-types: [minor, patch]

  # A imagem base do `Dockerfile-production` de cada app.
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
